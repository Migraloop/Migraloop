# One-install, two-container setup: app + PostgreSQL Platform Store.
# Platform Store Guardrails (ADR-0010 / issue #28): bundled Postgres ships product
# safe defaults (minimum floors enforced by the app). Free-disk warn uses the
# store data volume mounted read-only into the app.
services:
  platform-store:
    image: postgres:16
    environment:
      POSTGRES_USER: migraloop
      POSTGRES_PASSWORD: migraloop
      POSTGRES_DB: migraloop
    # Product-owned Platform Store defaults sized for throughput (ADR-0031 / #249).
    # Operators may raise further; the app rejects absurdly low overrides
    # (shared_buffers≥64MB, work_mem≥4MB, maintenance_work_mem≥64MB, max_connections≥20).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - effective_cache_size=2GB
    volumes:
      - platform_store_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migraloop -d migraloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      platform-store:
        condition: service_healthy
    environment:
      MIGRALOOP_PLATFORM_STORE_URL: postgres://migraloop:migraloop@platform-store:5432/migraloop
      # Observability Surface Prometheus scrape (ADR-0008 / issue #27)
      MIGRALOOP_METRICS_ADDR: 0.0.0.0:9090
      # Free-disk warn threshold probe path (same volume as platform-store)
      MIGRALOOP_PLATFORM_STORE_DATA_DIR: /var/lib/migraloop/platform-store-data
    volumes:
      - platform_store_data:/var/lib/migraloop/platform-store-data:ro
    ports:
      - "9090:9090"
    # ENTRYPOINT is already `migraloop`; only override the subcommand.
    command: ["run"]

volumes:
  platform_store_data:
