# Lab Scenario: remove-pipeline
# Self-contained Scenario Namespace for Local Sync Lab (ADR-0025 / issue #20).
# Applied via the real product `migraloop apply` path — not contract/stub.
# Two Direct Pipelines share one Base Dataset (CUSTOMERS) so remove can prove
# Shared Base retention for the remaining Pipeline.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-remove-pipeline
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-rp-customers
      mode: direct
      source:
        table: LAB_RP_CUSTOMERS
      target:
        collection: lab_rp_customers
    - name: lab-rp-customers-reporting
      mode: direct
      source:
        table: LAB_RP_CUSTOMERS
      target:
        collection: lab_rp_customers_reporting
