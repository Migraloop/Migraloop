# Lab Scenario recipe (ADR-0025 / issue #24).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: source-alignment
summary: Source Alignment Check detects Base≠Source, repairs Base only, resource-gated max-rows
namespace:
  source_tables:
    - LAB_SA_CUSTOMERS
  target_collections:
    - lab_sa_customers
  deployment: lab-source-alignment
  pipelines:
    - lab-sa-customers
  lifecycle:
    tables:
      - name: LAB_SA_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1)
    seed_sql: |
      INSERT INTO LAB_SA_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_SA_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
    mutate_sql: |
      UPDATE LAB_SA_CUSTOMERS SET NAME = 'AlignedAlice' WHERE ID = 1;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + Delivery)
    - mutate Source (ID=1 NAME→AlignedAlice) without sync — controlled Base≠Source
    - run align (default max-rows budget) — detect mismatch, repair Base from Source
    - assert Base repaired, Source unchanged by align, status shows Source Alignment
    - mutate Source ID=2; align --max-rows 1 — assert resource gate (not full slam)
    - align with larger budget — repair remaining Base row
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - assert
    apply:
      require_initial_load: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: base
      table: LAB_SA_CUSTOMERS
      present:
        - { field: NAME, value: AlignedAlice }
thresholds: {}
