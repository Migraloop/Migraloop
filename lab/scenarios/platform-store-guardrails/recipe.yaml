# Lab Scenario recipe (ADR-0025 / issue #28 / ADR-0010).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: platform-store-guardrails
summary: Platform Store Guardrails reject absurd settings; free-disk warn only (no auto-pause)
namespace:
  source_tables:
    - LAB_GUARD_CUSTOMERS
  target_collections:
    - lab_guard_customers
  deployment: lab-platform-store-guardrails
  pipelines:
    - lab-guard-customers
  lifecycle:
    tables:
      - name: LAB_GUARD_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1)
    seed_sql: |
      INSERT INTO LAB_GUARD_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_GUARD_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + Delivery)
    - status without inject still healthy (bundled Postgres meets guardrail minimums)
    - status with absurdly low shared_buffers inject → Guardrails rejection
    - status with injected low free disk → WARN + structured event; Platform Store stays healthy
    - assert Pipeline is not auto-paused for disk pressure
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - assert
    apply:
      require_initial_load: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: status
      contains:
        - "Platform Store"
thresholds: {}
