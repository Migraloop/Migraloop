# Lab Scenario recipe (ADR-0025 / issue #22 / ADR-0015 / #173).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: poison-quarantine
summary: Quarantine poison Output Identity after bounded retries; Pipeline continues; status unhealthy
namespace:
  source_tables:
    - LAB_PQ_CUSTOMERS
  target_collections:
    - lab_pq_customers
  deployment: lab-poison-quarantine
  pipelines:
    - lab-pq-customers
  lifecycle:
    tables:
      - name: LAB_PQ_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1)
    seed_sql: |
      INSERT INTO LAB_PQ_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_PQ_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
    mutate_sql: |
      UPDATE LAB_PQ_CUSTOMERS SET NAME = 'Alicia', EMAIL = 'alicia@example.com' WHERE ID = 1;
      INSERT INTO LAB_PQ_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (3, 'Carol', 'carol@example.com', 1);
      DELETE FROM LAB_PQ_CUSTOMERS WHERE ID = 2;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + Delivery)
    - mutate Source (update identity 1, insert 3, delete 2)
    - sync Incremental Capture with Lab poison Delivery injection for identity 1
    - assert quarantine alert, other identities Deliver, status shows unhealthy quarantine
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_delivery: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: target
      collection: lab_pq_customers
      present:
        - { field: NAME, value: Alice }
        - { field: NAME, value: Carol }
      absent:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Bob }
    - surface: status
      contains:
        - "Delivery Health: unhealthy"
        - lab-pq-customers
        - quarantine
        - identity=1
thresholds: {}
