# Lab Scenario recipe (ADR-0025 / issue #66 / #178).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: rt-filter
summary: "Rich Transform filter: ACTIVE eq 1 → Derived → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_RF_CUSTOMERS
  target_collections:
    - lab_rf_customers
  deployment: lab-rt-filter
  pipelines:
    - lab-rf-customers
  lifecycle:
    tables:
      - name: LAB_RF_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1) NOT NULL
    seed_sql: |
      INSERT INTO LAB_RF_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_RF_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
    mutate_sql: |
      UPDATE LAB_RF_CUSTOMERS SET NAME = 'Alicia', EMAIL = 'alicia@example.com' WHERE ID = 1;
      UPDATE LAB_RF_CUSTOMERS SET ACTIVE = 1 WHERE ID = 2;
      INSERT INTO LAB_RF_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (3, 'Carol', 'carol@example.com', 1);
      INSERT INTO LAB_RF_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (4, 'Dana', 'dana@example.com', 0);
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + filter Derived)
    - mutate Source (rename Alice, flip Bob ACTIVE 0→1, insert active Carol + inactive Dana)
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: derived
      pipeline: lab-rf-customers
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Bob }
        - { field: NAME, value: Carol }
      absent:
        - { field: NAME, value: Dana }
    - surface: target
      collection: lab_rf_customers
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Bob }
        - { field: NAME, value: Carol }
      absent:
        - { field: NAME, value: Dana }
thresholds: {}
