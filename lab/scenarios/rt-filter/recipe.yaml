# Lab Scenario recipe (ADR-0025 / issue #66).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: rt-filter
summary: "Rich Transform filter: ACTIVE eq 1 → Derived → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_RF_CUSTOMERS
  target_collections:
    - lab_rf_customers
  deployment: lab-rt-filter
  pipelines:
    - lab-rf-customers
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + filter Derived)
    - mutate Source insert/update/delete (including ACTIVE flips)
    - sync Incremental Capture + Delivery via real LogMiner path
checks:
  correctness:
    - "After Initial Load: only ACTIVE=1 seed row (Alice) in Derived/Target"
    - "After mutate+sync: Alicia and Carol present; inactive Bob absent"
thresholds: {}
