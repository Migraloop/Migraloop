# Lab Scenario recipe (ADR-0025 / issue #65).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: concurrent-source-workload
summary: "Intra-Scenario concurrent Source workload: parallel multi-table changes → Target/Derived under contention"
namespace:
  source_tables:
    - LAB_CW_CUSTOMERS
    - LAB_CW_ORDERS
  target_collections:
    - lab_cw_customers
    - lab_cw_order_totals
  deployment: lab-concurrent-source-workload
  pipelines:
    - lab-cw-customers
    - lab-cw-order-totals
  lifecycle:
    tables:
      - name: LAB_CW_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200)
      - name: LAB_CW_ORDERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          CUSTOMER_ID NUMBER(10) NOT NULL,
          AMOUNT NUMBER(10) NOT NULL,
          NOTE VARCHAR2(200)
    seed_sql: |
      INSERT INTO LAB_CW_CUSTOMERS (ID, NAME, EMAIL) VALUES (1, 'Alice', 'alice@example.com');
      INSERT INTO LAB_CW_CUSTOMERS (ID, NAME, EMAIL) VALUES (2, 'Bob', 'bob@example.com');
      INSERT INTO LAB_CW_ORDERS (ID, CUSTOMER_ID, AMOUNT, NOTE) VALUES (1, 1, 10, 'seed-a');
      INSERT INTO LAB_CW_ORDERS (ID, CUSTOMER_ID, AMOUNT, NOTE) VALUES (2, 1, 20, 'seed-b');
      INSERT INTO LAB_CW_ORDERS (ID, CUSTOMER_ID, AMOUNT, NOTE) VALUES (3, 2, 5, 'seed-c');
deployment_config: deployment.yaml
workload:
  concurrency: parallel
  steps:
    - prepare multi-table Scenario Namespace + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + Derived)
    - mutate with parallel Source sessions (customers + orders) inside one Scenario
    - settle sync/Delivery within max_settle_ms before final asserts
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - "Customers Base/Target Managed NAME: Alicia and Carol present; Bob absent"
    - "Derived and order-totals Target after contention: totals 35 and 50 (not stale 30)"
thresholds:
  max_settle_ms: 300000
