# Lab Scenario: concurrent-source-workload
# Multi-table Scenario Namespace with intra-Scenario concurrent Source workload
# (parallel sqlplus sessions). Applied via the real product `migraloop apply` path.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-concurrent-source-workload
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-cw-customers
      mode: direct
      source:
        table: LAB_CW_CUSTOMERS
      target:
        collection: lab_cw_customers
    - name: lab-cw-order-totals
      mode: transform
      source:
        table: LAB_CW_ORDERS
      target:
        collection: lab_cw_order_totals
      outputIdentity: [CUSTOMER_ID]
      transform:
        - groupBy:
            keys: [CUSTOMER_ID]
            aggregates:
              - op: sum
                field: AMOUNT
                as: TOTAL_AMOUNT
