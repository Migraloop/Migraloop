# Lab Scenario recipe (ADR-0025 / issue #129 / #178).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: rt-unwind
summary: "Rich Transform unwind: equiLookup array → unwound Output Identities → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_RU_CUSTOMERS
    - LAB_RU_ORDERS
  target_collections:
    - lab_ru_orders
  deployment: lab-rt-unwind
  pipelines:
    - lab-ru-orders
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace tables + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load both Bases + equiLookup+unwind Derived)
    - mutate primary NAME + foreign AMOUNT + delete one order (identity insert/update/delete)
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - "Derived/Target are one document per ORDER_ID after unwind flatten"
    - "Primary NAME and foreign AMOUNT updates refresh unwound identities; deleted order is removed"
thresholds: {}
