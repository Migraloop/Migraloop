# Lab Scenario: rt-unwind
# Rich Transform unwind coverage (ADR-0025 / issue #129).
# Applied via the real product `migraloop apply` path — not contract/stub.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-rt-unwind
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-ru-orders
      mode: transform
      source:
        table: LAB_RU_CUSTOMERS
      target:
        collection: lab_ru_orders
      outputIdentity: [ORDER_ID]
      transform:
        - $project:
            ID: 1
            NAME: 1
        - $lookup:
            from: LAB_RU_ORDERS
            localField: ID
            foreignField: CUSTOMER_ID
            as: orders
        - $unwind: "$orders"
