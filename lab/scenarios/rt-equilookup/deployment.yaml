# Lab Scenario: rt-equilookup
# Rich Transform equiLookup multi-Base coverage (ADR-0025 / issue #127).
# Applied via the real product `migraloop apply` path — not contract/stub.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-rt-equilookup
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-rel-customers
      mode: transform
      source:
        table: LAB_REL_CUSTOMERS
      target:
        collection: lab_rel_customers
      outputIdentity: [ID]
      transform:
        - project:
            fields: [ID, NAME]
        - equiLookup:
            from: LAB_REL_ORDERS
            localField: ID
            foreignField: CUSTOMER_ID
            as: orders
