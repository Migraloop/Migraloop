# Lab Scenario recipe (ADR-0025 / issue #127 / #178).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: rt-equilookup
summary: "Rich Transform equiLookup: multi-Base join → Derived → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_REL_CUSTOMERS
    - LAB_REL_ORDERS
  target_collections:
    - lab_rel_customers
  deployment: lab-rt-equilookup
  pipelines:
    - lab-rel-customers
  lifecycle:
    tables:
      - name: LAB_REL_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200)
      - name: LAB_REL_ORDERS
        columns: |
          ORDER_ID NUMBER(10) PRIMARY KEY,
          CUSTOMER_ID NUMBER(10) NOT NULL,
          AMOUNT NUMBER(12,2) NOT NULL
    seed_sql: |
      INSERT INTO LAB_REL_CUSTOMERS (ID, NAME, EMAIL) VALUES (1, 'Alice', 'alice@example.com');
      INSERT INTO LAB_REL_CUSTOMERS (ID, NAME, EMAIL) VALUES (2, 'Bob', 'bob@example.com');
      INSERT INTO LAB_REL_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT) VALUES (100, 1, 42.50);
      INSERT INTO LAB_REL_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT) VALUES (101, 1, 10.00);
      INSERT INTO LAB_REL_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT) VALUES (200, 2, 5.00);
    mutate_sql: |
      UPDATE LAB_REL_CUSTOMERS SET NAME = 'Alicia' WHERE ID = 1;
      UPDATE LAB_REL_ORDERS SET AMOUNT = 50.00 WHERE ORDER_ID = 100;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace tables + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load both Bases + equiLookup Derived)
    - mutate primary + foreign Source rows (NAME change; order AMOUNT change)
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: derived
      pipeline: lab-rel-customers
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Bob }
      contains: [orders, "50"]
      not_contains: ["42.50"]
    - surface: target
      collection: lab_rel_customers
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Bob }
      contains: [orders, "50"]
thresholds: {}
