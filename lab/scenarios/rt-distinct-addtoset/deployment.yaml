# Lab Scenario: rt-distinct-addtoset
# Rich Transform distinct / addToSet + Maintenance State (ADR-0025 / issue #128).
# Applied via the real product `migraloop apply` path — not contract/stub.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-rt-distinct-addtoset
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-rda-distinct-customers
      mode: transform
      source:
        table: LAB_RDA_ORDERS
      target:
        collection: lab_rda_distinct_customers
      outputIdentity: [CUSTOMER_ID]
      transform:
        - $group:
            _id: "$CUSTOMER_ID"
    - name: lab-rda-amounts-by-customer
      mode: transform
      source:
        table: LAB_RDA_ORDERS
      target:
        collection: lab_rda_amounts_by_customer
      outputIdentity: [CUSTOMER_ID]
      transform:
        - $group:
            _id: "$CUSTOMER_ID"
            AMOUNTS:
              $addToSet: "$AMOUNT"
