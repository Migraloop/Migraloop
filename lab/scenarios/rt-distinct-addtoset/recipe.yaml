# Lab Scenario recipe (ADR-0025 / issue #128 / #178).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: rt-distinct-addtoset
summary: "Rich Transform distinct/addToSet with Maintenance State → Derived → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_RDA_ORDERS
  target_collections:
    - lab_rda_distinct_customers
    - lab_rda_amounts_by_customer
  deployment: lab-rt-distinct-addtoset
  pipelines:
    - lab-rda-distinct-customers
    - lab-rda-amounts-by-customer
  lifecycle:
    tables:
      - name: LAB_RDA_ORDERS
        columns: |
          ORDER_ID NUMBER(10) PRIMARY KEY,
          CUSTOMER_ID NUMBER(10) NOT NULL,
          AMOUNT NUMBER(12,2) NOT NULL,
          ADDRESS VARCHAR2(200)
    seed_sql: |
      INSERT INTO LAB_RDA_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT, ADDRESS) VALUES (100, 1, 42.50, '1 Main St');
      INSERT INTO LAB_RDA_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT, ADDRESS) VALUES (101, 1, 10.00, '1 Main St');
      INSERT INTO LAB_RDA_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT, ADDRESS) VALUES (200, 2, 5.00, '2 Side Rd');
    mutate_sql: |
      UPDATE LAB_RDA_ORDERS SET ADDRESS = '1 Main Ave' WHERE ORDER_ID = 100;
      INSERT INTO LAB_RDA_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT, ADDRESS) VALUES (102, 1, 42.50, '1 Main Ave');
      INSERT INTO LAB_RDA_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT, ADDRESS) VALUES (103, 1, 7.00, '1 Main Ave');
      UPDATE LAB_RDA_ORDERS SET CUSTOMER_ID = 3 WHERE ORDER_ID = 200;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace ORDERS-like table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + distinct/addToSet Derived)
    - mutate Source (unused ADDRESS; duplicate CUSTOMER_ID; new AMOUNT; CUSTOMER_ID key move)
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - "distinct Derived/Target lists customers 1 and 3 (not 2) after key move"
    - "addToSet Derived/Target includes AMOUNT 7.00 for customer 1 and 5.00 for customer 3"
thresholds: {}
