# Lab Scenario recipe (ADR-0025 / issue #19 / ADR-0007).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: pause-resume
summary: Pause and resume Pipeline CLI verbs (stop Delivery; catch-up from durable state)
namespace:
  source_tables:
    - LAB_PR_CUSTOMERS
    - LAB_PR_ORDERS
  target_collections:
    - lab_pr_customers
    - lab_pr_orders
  deployment: lab-pause-resume
  pipelines:
    - lab-pr-customers
    - lab-pr-orders
  lifecycle:
    tables:
      - name: LAB_PR_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1)
      - name: LAB_PR_ORDERS
        columns: |
          ORDER_ID NUMBER(10) PRIMARY KEY,
          CUSTOMER_ID NUMBER(10) NOT NULL,
          AMOUNT NUMBER(12,2) NOT NULL,
          ADDRESS VARCHAR2(200)
    seed_sql: |
      INSERT INTO LAB_PR_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_PR_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
      INSERT INTO LAB_PR_ORDERS (ORDER_ID, CUSTOMER_ID, AMOUNT, ADDRESS) VALUES (100, 1, 42.50, '1 Main St');
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace tables + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + Delivery for both Pipelines)
    - pause customers Pipeline via CLI
    - mutate Source for both tables
    - sync Incremental Capture; paused Pipeline skips Delivery; orders Pipeline Delivers
    - resume customers Pipeline (catch-up Delivery from durable Base)
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_delivery: true
    sync:
      require_logminer: true
checks:
  correctness:
    - "While paused: customers Target retains Initial Load (Alice/Bob); orders Target receives Incremental update"
    - "After resume: customers Target matches durable Base (Alicia + Carol; Bob deleted)"
    - "Other Pipeline (orders) remains Delivered throughout"
thresholds: {}
