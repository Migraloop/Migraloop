# Lab Scenario recipe (ADR-0025 / issue #65).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: transform-pipeline
summary: "Multi-table Transform Pipeline: customers + orders groupBy sum/count/min/max/avg → Derived → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_TP_CUSTOMERS
    - LAB_TP_ORDERS
  target_collections:
    - lab_tp_customers
    - lab_tp_order_totals
  deployment: lab-transform-pipeline
  pipelines:
    - lab-tp-customers
    - lab-tp-order-totals
  lifecycle:
    tables:
      - name: LAB_TP_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200)
      - name: LAB_TP_ORDERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          CUSTOMER_ID NUMBER(10) NOT NULL,
          AMOUNT NUMBER(10) NOT NULL,
          NOTE VARCHAR2(200)
    seed_sql: |
      INSERT INTO LAB_TP_CUSTOMERS (ID, NAME, EMAIL) VALUES (1, 'Alice', 'alice@example.com');
      INSERT INTO LAB_TP_CUSTOMERS (ID, NAME, EMAIL) VALUES (2, 'Bob', 'bob@example.com');
      INSERT INTO LAB_TP_ORDERS (ID, CUSTOMER_ID, AMOUNT, NOTE) VALUES (1, 1, 10, 'seed-a');
      INSERT INTO LAB_TP_ORDERS (ID, CUSTOMER_ID, AMOUNT, NOTE) VALUES (2, 1, 20, 'seed-b');
      INSERT INTO LAB_TP_ORDERS (ID, CUSTOMER_ID, AMOUNT, NOTE) VALUES (3, 2, 5, 'seed-c');
    mutate_sql: |
      UPDATE LAB_TP_CUSTOMERS SET NAME = 'Alicia', EMAIL = 'alicia@example.com' WHERE ID = 1;
      INSERT INTO LAB_TP_CUSTOMERS (ID, NAME, EMAIL) VALUES (3, 'Carol', 'carol@example.com');
      DELETE FROM LAB_TP_CUSTOMERS WHERE ID = 2;
      INSERT INTO LAB_TP_ORDERS (ID, CUSTOMER_ID, AMOUNT, NOTE) VALUES (4, 1, 15, 'new');
      UPDATE LAB_TP_ORDERS SET AMOUNT = 50, NOTE = 'bumped' WHERE ID = 3;
      DELETE FROM LAB_TP_ORDERS WHERE ID = 1;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare multi-table Scenario Namespace + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + Derived)
    - mutate multi-table Source insert/update/delete
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: base
      table: LAB_TP_CUSTOMERS
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Carol }
      absent:
        - { field: NAME, value: Bob }
    - surface: target
      collection: lab_tp_customers
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Carol }
      absent:
        - { field: NAME, value: Bob }
    - surface: derived
      pipeline: lab-tp-order-totals
      amount_present: ["35", "50"]
      amount_absent: ["30"]
      present:
        - { field: ORDER_COUNT, value: "2" }
        - { field: ORDER_COUNT, value: "1" }
        - { field: MIN_AMOUNT, value: "15" }
        - { field: MAX_AMOUNT, value: "20" }
        - { field: AVG_AMOUNT, value: "17.5" }
    - surface: target
      collection: lab_tp_order_totals
      amount_present: ["35", "50"]
      amount_absent: ["30"]
      present:
        - { field: ORDER_COUNT, value: "2" }
        - { field: ORDER_COUNT, value: "1" }
        - { field: MIN_AMOUNT, value: "15" }
        - { field: MAX_AMOUNT, value: "20" }
        - { field: AVG_AMOUNT, value: "17.5" }
thresholds: {}
