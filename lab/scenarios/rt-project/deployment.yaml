# Lab Scenario: rt-project
# Operator-specific Rich Transform `$project` coverage (ADR-0025 / issue #66 / #233).
# Applied via the real product `migraloop apply` path — not contract/stub.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-rt-project
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-rp-customers
      mode: transform
      source:
        table: LAB_RP_CUSTOMERS
      target:
        collection: lab_rp_customers
      outputIdentity: [ID]
      transform:
        - $project:
            ID: 1
            NAME: 1
