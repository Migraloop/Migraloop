# Lab Scenario recipe (ADR-0025 / issue #66 / #173).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: rt-project
summary: "Rich Transform project: keep Managed ID/NAME only → Derived → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_RP_CUSTOMERS
  target_collections:
    - lab_rp_customers
  deployment: lab-rt-project
  pipelines:
    - lab-rp-customers
  lifecycle:
    tables:
      - name: LAB_RP_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200)
    seed_sql: |
      INSERT INTO LAB_RP_CUSTOMERS (ID, NAME, EMAIL) VALUES (1, 'Alice', 'alice@example.com');
      INSERT INTO LAB_RP_CUSTOMERS (ID, NAME, EMAIL) VALUES (2, 'Bob', 'bob@example.com');
    mutate_sql: |
      UPDATE LAB_RP_CUSTOMERS SET NAME = 'Alicia', EMAIL = 'alicia@example.com' WHERE ID = 1;
      INSERT INTO LAB_RP_CUSTOMERS (ID, NAME, EMAIL) VALUES (3, 'Carol', 'carol@example.com');
      DELETE FROM LAB_RP_CUSTOMERS WHERE ID = 2;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + project Derived)
    - mutate Source insert/update/delete
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - "Derived/Target Managed NAME: Alicia and Carol present; Bob absent"
    - "Projected shape: EMAIL not present as Managed field on Derived/Target"
thresholds: {}
