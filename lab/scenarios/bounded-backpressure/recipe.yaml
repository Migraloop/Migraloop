# Lab Scenario recipe (ADR-0025 / issue #26 / ADR-0020).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: bounded-backpressure
summary: Bounded queues under Downstream slowness; Sync/Delivery lag visible; Pipeline not paused
namespace:
  source_tables:
    - LAB_BP_CUSTOMERS
  target_collections:
    - lab_bp_customers
  deployment: lab-bounded-backpressure
  pipelines:
    - lab-bp-customers
  lifecycle:
    tables:
      - name: LAB_BP_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1)
    seed_sql: |
      INSERT INTO LAB_BP_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_BP_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + Delivery)
    - insert Source backlog (many rows)
    - sync with Downstream Delivery delay + small queue capacity; stop mid-window
    - assert Backpressure signal, queue_depth within capacity, status lag > 0, not paused
    - sync catch-up without delay; lag → 0; Target receives backlog
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_delivery: true
    sync:
      require_logminer: true
      allow_fail: true
checks:
  correctness:
    - surface: target
      collection: lab_bp_customers
      contains: [User100, User119]
thresholds: {}
