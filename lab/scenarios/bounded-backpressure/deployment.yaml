# Lab Scenario: bounded-backpressure
# Self-contained Scenario Namespace for Local Sync Lab (ADR-0025 / issue #26).
# Applied via the real product `migraloop apply` path — not contract/stub.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-bounded-backpressure
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-bp-customers
      mode: direct
      source:
        table: LAB_BP_CUSTOMERS
      target:
        collection: lab_bp_customers
