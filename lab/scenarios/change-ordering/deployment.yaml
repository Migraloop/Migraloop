# Lab Scenario: change-ordering
# ADR-0029 Change Ordering / confluence — same-key capture order, cross-key
# interleave, and min aggregate Base recompute on the normal Incremental path
# (not Source Alignment Check / Drift Check). Real product `migraloop apply`.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-change-ordering
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-co-customers
      mode: direct
      source:
        table: LAB_CO_CUSTOMERS
      target:
        collection: lab_co_customers
    - name: lab-co-order-stats
      mode: transform
      source:
        table: LAB_CO_ORDERS
      target:
        collection: lab_co_order_stats
      outputIdentity: [CUSTOMER_ID]
      transform:
        - groupBy:
            keys: [CUSTOMER_ID]
            aggregates:
              - op: count
                field: ID
                as: ORDER_COUNT
              - op: min
                field: AMOUNT
                as: MIN_AMOUNT
              - op: max
                field: AMOUNT
                as: MAX_AMOUNT
              - op: sum
                field: AMOUNT
                as: TOTAL_AMOUNT
