# Lab Scenario recipe (ADR-0025 / issue #130 / #178).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: rt-union
summary: "Rich Transform union: multi-Base concatenate → Derived → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_RNU_EAST
    - LAB_RNU_WEST
  target_collections:
    - lab_rnu_customers
  deployment: lab-rt-union
  pipelines:
    - lab-rnu-customers
  lifecycle:
    tables:
      - name: LAB_RNU_EAST
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200)
      - name: LAB_RNU_WEST
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200)
    seed_sql: |
      INSERT INTO LAB_RNU_EAST (ID, NAME, EMAIL) VALUES (1, 'Alice', 'alice@example.com');
      INSERT INTO LAB_RNU_EAST (ID, NAME, EMAIL) VALUES (2, 'Bob', 'bob@example.com');
      INSERT INTO LAB_RNU_WEST (ID, NAME, EMAIL) VALUES (10, 'Zoe', 'zoe@example.com');
      INSERT INTO LAB_RNU_WEST (ID, NAME, EMAIL) VALUES (11, 'Wade', 'wade@example.com');
    mutate_sql: |
      UPDATE LAB_RNU_EAST SET NAME = 'Alicia' WHERE ID = 1;
      UPDATE LAB_RNU_WEST SET NAME = 'Zora' WHERE ID = 10;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace tables + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load both Bases + union Derived)
    - mutate east + west Source rows (NAME changes on each contributing Base)
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: derived
      pipeline: lab-rnu-customers
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Zora }
        - { field: NAME, value: Wade }
      absent:
        - { field: NAME, value: Alice }
        - { field: NAME, value: Zoe }
    - surface: target
      collection: lab_rnu_customers
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Zora }
        - { field: NAME, value: Wade }
thresholds: {}
