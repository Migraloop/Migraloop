# Lab Scenario: rt-union
# Rich Transform union multi-Base coverage (ADR-0025 / issue #130).
# Applied via the real product `migraloop apply` path — not contract/stub.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-rt-union
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-rnu-customers
      mode: transform
      source:
        table: LAB_RNU_EAST
      target:
        collection: lab_rnu_customers
      outputIdentity: [ID]
      transform:
        - union:
            from: LAB_RNU_WEST
        - project:
            fields: [ID, NAME]
