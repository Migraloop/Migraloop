# Lab Scenario recipe (ADR-0025 / issue #125 / #178).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: rt-field-ops
summary: "Rich Transform addFields/rename/remove: shape Managed fields → Derived → Delivery (real apply/sync)"
namespace:
  source_tables:
    - LAB_RFO_CUSTOMERS
  target_collections:
    - lab_rfo_customers
  deployment: lab-rt-field-ops
  pipelines:
    - lab-rfo-customers
  lifecycle:
    tables:
      - name: LAB_RFO_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1) NOT NULL
    seed_sql: |
      INSERT INTO LAB_RFO_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_RFO_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
    mutate_sql: |
      UPDATE LAB_RFO_CUSTOMERS SET EMAIL = 'alice-only@example.com' WHERE ID = 1;
      UPDATE LAB_RFO_CUSTOMERS SET NAME = 'Alicia' WHERE ID = 1;
      INSERT INTO LAB_RFO_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (3, 'Carol', 'carol@example.com', 1);
      DELETE FROM LAB_RFO_CUSTOMERS WHERE ID = 2;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load + field-ops Derived)
    - mutate Source insert/update/delete (including EMAIL-only unused change)
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: derived
      pipeline: lab-rfo-customers
      present:
        - { field: customerName, value: Alicia }
        - { field: displayName, value: Alicia }
        - { field: customerName, value: Carol }
        - { field: source, value: oracle }
      absent:
        - { field: customerName, value: Bob }
      field_absent: [EMAIL]
    - surface: target
      collection: lab_rfo_customers
      present:
        - { field: customerName, value: Alicia }
        - { field: displayName, value: Alicia }
        - { field: customerName, value: Carol }
        - { field: source, value: oracle }
      absent:
        - { field: customerName, value: Bob }
      field_absent: [EMAIL]
thresholds: {}
