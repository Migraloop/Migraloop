# Lab Scenario recipe (ADR-0025 / issue #21 / ADR-0007).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: change-pipeline
summary: Change Pipeline revision via apply (pause old Delivery; rebuild Derived; metadata-only skip)
namespace:
  source_tables:
    - LAB_CP_CUSTOMERS
  target_collections:
    - lab_cp_active_customers
    - lab_cp_customers_reporting
  deployment: lab-change-pipeline
  pipelines:
    - lab-cp-active-customers
    - lab-cp-customers-reporting
  lifecycle:
    tables:
      - name: LAB_CP_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1)
    seed_sql: |
      INSERT INTO LAB_CP_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_CP_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
      INSERT INTO LAB_CP_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (3, 'Carol', 'carol@example.com', 1);
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Transform ACTIVE==1 + shared Direct reporting)
    - apply semantic revision (ACTIVE==0) via real product path
    - assert Derived/Target rebuilt with delete reconciliation; Shared Base not Initial-Loaded again
    - sync Incremental Capture under the new revision (Pipeline not left paused)
    - apply metadata-only description change; assert rebuild skipped
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
      require_delivery: true
      require_derived: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: target
      collection: lab_cp_active_customers
      present:
        - { field: NAME, value: Bob }
      absent:
        - { field: NAME, value: Alice }
        - { field: NAME, value: Carol }
thresholds: {}
