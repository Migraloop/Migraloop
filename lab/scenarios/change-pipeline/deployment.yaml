# Lab Scenario: change-pipeline (initial revision)
# Self-contained Scenario Namespace for Local Sync Lab (ADR-0025 / issue #21).
# Applied via the real product `migraloop apply` path — not contract/stub.
# Transform Pipeline + shared Direct Pipeline on the same Base prove Shared Bases
# are not rebuilt when the Transform revision changes.
apiVersion: migraloop.dev/v1
kind: Deployment
metadata:
  name: lab-change-pipeline
spec:
  source:
    kind: oracle
    host: 127.0.0.1
    port: 1521
    database: FREEPDB1
    username: SYNC_USER
    password:
      fromEnv: ORACLE_PASSWORD
  target:
    kind: mongodb
    host: 127.0.0.1
    port: 27017
    database: lab
    username: migraloop
    password:
      fromEnv: MONGO_PASSWORD
  pipelines:
    - name: lab-cp-active-customers
      mode: transform
      description: active customers v1
      source:
        table: LAB_CP_CUSTOMERS
      target:
        collection: lab_cp_active_customers
      outputIdentity: [ID]
      transform:
        - project:
            fields: [ID, NAME, ACTIVE]
        - filter:
            field: ACTIVE
            eq: 1
    - name: lab-cp-customers-reporting
      mode: direct
      source:
        table: LAB_CP_CUSTOMERS
      target:
        collection: lab_cp_customers_reporting
