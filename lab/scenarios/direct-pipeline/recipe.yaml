# Lab Scenario recipe (ADR-0025 / issue #65 / #173).
# Catalog listing (`migraloop lab scenario list`) reads this file.
id: direct-pipeline
summary: Direct Pipeline Initial Load + insert/update/delete (real apply/sync)
namespace:
  source_tables:
    - LAB_DP_CUSTOMERS
  target_collections:
    - lab_dp_customers
  deployment: lab-direct-pipeline
  pipelines:
    - lab-dp-customers
  lifecycle:
    tables:
      - name: LAB_DP_CUSTOMERS
        columns: |
          ID NUMBER(10) PRIMARY KEY,
          NAME VARCHAR2(100) NOT NULL,
          EMAIL VARCHAR2(200),
          ACTIVE NUMBER(1)
    seed_sql: |
      INSERT INTO LAB_DP_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (1, 'Alice', 'alice@example.com', 1);
      INSERT INTO LAB_DP_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (2, 'Bob', 'bob@example.com', 0);
    mutate_sql: |
      UPDATE LAB_DP_CUSTOMERS SET NAME = 'Alicia', EMAIL = 'alicia@example.com' WHERE ID = 1;
      INSERT INTO LAB_DP_CUSTOMERS (ID, NAME, EMAIL, ACTIVE) VALUES (3, 'Carol', 'carol@example.com', 1);
      DELETE FROM LAB_DP_CUSTOMERS WHERE ID = 2;
deployment_config: deployment.yaml
workload:
  concurrency: serial
  steps:
    - prepare Scenario Namespace table + seed + table-level supplemental logging
    - apply Deployment via real product path (Initial Load)
    - mutate Source insert/update/delete
    - sync Incremental Capture + Delivery via real LogMiner path
  product_path:
    steps:
      - prepare_namespace
      - product_apply
      - mutate
      - product_sync
      - assert
    apply:
      require_initial_load: true
    sync:
      require_logminer: true
checks:
  correctness:
    - surface: base
      table: LAB_DP_CUSTOMERS
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Carol }
      absent:
        - { field: NAME, value: Bob }
    - surface: target
      collection: lab_dp_customers
      present:
        - { field: NAME, value: Alicia }
        - { field: NAME, value: Carol }
      absent:
        - { field: NAME, value: Bob }
thresholds: {}
